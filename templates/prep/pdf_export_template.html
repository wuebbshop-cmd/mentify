<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>{{COURSE_UPPER}} &mdash; {{TOPIC_TITLE}}</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism-tomorrow.min.css">
<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/prism.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-r.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-python.min.js"></script>
<style>
  @page {
    size: A4;
    margin: 18mm 16mm;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: #1e293b;
    font-size: 10pt;
    line-height: 1.65;
    background: #ffffff;
    margin: 0;
    padding: 0;
  }
  .doc-header {
    border-bottom: 2.5px solid #0f766e;
    padding-bottom: 12px;
    margin-bottom: 22px;
  }
  .badge-tag {
    display: inline-block;
    background: #0f766e;
    color: #ffffff;
    font-size: 8pt;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 3px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  h1 {
    color: #0f766e;
    font-size: 18pt;
    font-weight: 800;
    margin: 8px 0 4px 0;
    line-height: 1.25;
  }
  .subtitle {
    color: #64748b;
    font-size: 9.5pt;
    font-weight: 500;
  }
  h2 {
    color: #0f766e;
    font-size: 13.5pt;
    font-weight: 700;
    border-bottom: 1px solid #e2e8f0;
    padding-bottom: 5px;
    margin-top: 24px;
    margin-bottom: 12px;
    page-break-after: avoid;
  }
  h3 {
    color: #334155;
    font-size: 11pt;
    font-weight: 600;
    margin-top: 18px;
    margin-bottom: 8px;
    page-break-after: avoid;
  }
  p {
    margin: 8px 0;
  }
  ul, ol {
    margin: 8px 0 12px 20px;
    padding: 0;
  }
  li {
    margin-bottom: 4px;
  }
  blockquote {
    border-left: 4px solid #0f766e;
    background: #f8fafc;
    border-radius: 0 4px 4px 0;
    padding: 10px 16px;
    margin: 14px 0;
    color: #334155;
    page-break-inside: avoid;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    margin: 14px 0;
    font-size: 9pt;
    page-break-inside: avoid;
  }
  th, td {
    border: 1px solid #cbd5e1;
    padding: 7px 10px;
    text-align: left;
  }
  th {
    background: #0f766e;
    color: #ffffff;
    font-weight: 600;
  }
  tr:nth-child(even) td {
    background: #f8fafc;
  }
  pre {
    background: #1e293b !important;
    color: #f8fafc !important;
    padding: 12px 16px;
    border-radius: 6px;
    font-family: "Consolas", "Courier New", monospace;
    font-size: 8.5pt;
    line-height: 1.5;
    margin: 14px 0;
    page-break-inside: avoid;
    white-space: pre-wrap;
    word-break: break-all;
  }
  code {
    font-family: "Consolas", "Courier New", monospace;
    font-size: 8.5pt;
    background: #f1f5f9;
    color: #0f766e;
    padding: 2px 5px;
    border-radius: 3px;
  }
  pre code {
    background: transparent !important;
    color: inherit !important;
    padding: 0 !important;
  }
  .katex-display {
    margin: 12px 0;
    text-align: center;
    page-break-inside: avoid;
  }
  hr {
    border: none;
    border-top: 1px solid #e2e8f0;
    margin: 20px 0;
  }
</style>
</head>
<body>

<div class="doc-header">
  <span class="badge-tag">Mentify Prep &bull; Verified Syllabus Study Pack &bull; {{LEVEL_DISPLAY}}</span>
  <h1>{{COURSE_UPPER}} &mdash; {{TOPIC_TITLE}}</h1>
  <div class="subtitle">Canonical Academic Notes &bull; {{LEVEL_DISPLAY}} &bull; Full Derivations &amp; Code &bull; Generated {{DATE_STR}}</div>
</div>

<div id="content"></div>
<div id="render-complete" style="display:none;"></div>

<script id="raw-notes" type="text/plain">{{ESCAPED_JSON}}</script>

<script>
{{RENDERER_JS}}
</script>
<script>
function renderPDFContent() {
  try {
    var rawData = JSON.parse(document.getElementById('raw-notes').textContent);
    renderMarkdownWithKaTeX(rawData, document.getElementById('content'));
  } catch(e) {
    console.error('PDF render error:', e);
  } finally {
    var el = document.getElementById('render-complete');
    if (el) {
      el.className = 'render-complete';
      el.setAttribute('data-done', 'true');
    }
  }
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', renderPDFContent);
} else {
  renderPDFContent();
}
</script>
</body>
</html>
