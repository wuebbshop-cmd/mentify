<!-- Mentify Prep AI Assistant Widget -->
<style>
  .prep-chatbot-trigger {
    position: fixed;
    bottom: 24px;
    right: 24px;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: var(--green, #0f766e);
    color: #ffffff;
    border: 1px solid rgba(0, 0, 0, 0.1);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 16px rgba(15, 118, 110, 0.28);
    z-index: 9999;
    transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
  }
  .prep-chatbot-trigger:hover {
    background: #0d6962;
    transform: scale(1.05);
    box-shadow: 0 6px 20px rgba(15, 118, 110, 0.38);
  }
  .prep-chatbot-trigger .prep-online-dot {
    position: absolute;
    top: 2px;
    right: 2px;
    width: 13px;
    height: 13px;
    background: #22c55e;
    border: 2px solid #ffffff;
    border-radius: 50%;
  }

  .prep-chatbot-window {
    position: fixed;
    bottom: 88px;
    right: 24px;
    width: 390px;
    max-width: calc(100vw - 32px);
    height: 530px;
    max-height: calc(100vh - 110px);
    background: var(--surface, #ffffff);
    border: 1px solid var(--border, #e2e8f0);
    border-radius: 16px;
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.18);
    z-index: 9999;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    opacity: 0;
    visibility: hidden;
    transform: translateY(16px) scale(0.96);
    transition: opacity 0.25s ease, transform 0.25s ease, visibility 0.25s ease;
  }
  .prep-chatbot-window.active {
    opacity: 1;
    visibility: visible;
    transform: translateY(0) scale(1);
  }

  .prep-chatbot-header {
    background: var(--green, #0f766e);
    color: #ffffff;
    padding: 13px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
  }
  .prep-chatbot-header-info {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .prep-chatbot-avatar {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.18);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
  }
  .prep-chatbot-header-title {
    font-weight: 700;
    font-size: 0.92rem;
    line-height: 1.2;
    margin: 0;
    color: #ffffff;
  }
  .prep-chatbot-header-subtitle {
    font-size: 0.72rem;
    opacity: 0.9;
    display: flex;
    align-items: center;
    gap: 5px;
    margin-top: 2px;
  }
  .prep-chatbot-header-actions {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .prep-chatbot-btn-icon {
    background: none;
    border: none;
    color: #ffffff;
    opacity: 0.85;
    cursor: pointer;
    padding: 6px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.15s ease, background 0.15s ease;
  }
  .prep-chatbot-btn-icon:hover {
    opacity: 1;
    background: rgba(255, 255, 255, 0.18);
  }

  .prep-chatbot-messages {
    flex: 1;
    padding: 16px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
    background: var(--bg-body, #fafafa);
    scrollbar-width: none; /* Firefox */
    -ms-overflow-style: none; /* IE / Edge */
  }
  .prep-chatbot-messages::-webkit-scrollbar {
    display: none;
    width: 0;
    height: 0;
  }

  .prep-chatbot-msg {
    max-width: 88%;
    padding: 10px 14px;
    font-size: 0.86rem;
    line-height: 1.48;
    word-break: break-word;
  }
  .prep-chatbot-msg-user {
    align-self: flex-end;
    background: var(--green, #0f766e);
    color: #ffffff;
    border-radius: 16px 16px 3px 16px;
  }
  .prep-chatbot-msg-ai {
    align-self: flex-start;
    background: var(--surface, #ffffff);
    color: var(--text, #1e293b);
    border: 1px solid var(--border, #e2e8f0);
    border-radius: 16px 16px 16px 3px;
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.04);
  }
  .prep-chatbot-msg-ai a {
    color: var(--green, #0f766e);
    font-weight: 600;
    text-decoration: underline;
    text-underline-offset: 2px;
  }
  .prep-chatbot-msg-ai a:hover {
    text-decoration: none;
  }
  .prep-chatbot-msg-ai p {
    margin: 0 0 6px 0;
  }
  .prep-chatbot-msg-ai p:last-child {
    margin-bottom: 0;
  }
  .prep-chatbot-msg-ai ul, .prep-chatbot-msg-ai ol {
    margin: 4px 0;
    padding-left: 20px;
  }

  .prep-chatbot-suggestions {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 10px;
  }
  .prep-chatbot-chip {
    background: var(--surface, #ffffff);
    border: 1px solid var(--green, #0f766e);
    color: var(--green, #0f766e);
    font-size: 0.76rem;
    padding: 5px 10px;
    border-radius: 14px;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
    font-family: inherit;
    text-align: left;
  }
  .prep-chatbot-chip:hover {
    background: var(--green, #0f766e);
    color: #ffffff;
  }

  .prep-chatbot-typing {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 10px 14px;
    background: var(--surface, #ffffff);
    border: 1px solid var(--border, #e2e8f0);
    border-radius: 16px 16px 16px 3px;
    align-self: flex-start;
    width: fit-content;
  }
  .prep-chatbot-dot {
    width: 6px;
    height: 6px;
    background: var(--text-muted, #94a3b8);
    border-radius: 50%;
    animation: prepChatDot 1.4s infinite ease-in-out both;
  }
  .prep-chatbot-dot:nth-child(1) { animation-delay: -0.32s; }
  .prep-chatbot-dot:nth-child(2) { animation-delay: -0.16s; }
  @keyframes prepChatDot {
    0%, 80%, 100% { transform: scale(0); }
    40% { transform: scale(1); }
  }

  .prep-chatbot-input-area {
    padding: 10px 12px;
    background: var(--surface, #ffffff);
    border-top: 1px solid var(--border, #e2e8f0);
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .prep-chatbot-input {
    flex: 1;
    border: 1px solid var(--border, #cbd5e1);
    border-radius: 20px;
    padding: 8px 14px;
    font-size: 0.85rem;
    outline: none;
    background: var(--bg-body, #ffffff);
    color: var(--text, #0f172a);
    font-family: inherit;
    transition: border-color 0.15s ease;
  }
  .prep-chatbot-input:focus {
    border-color: var(--green, #0f766e);
  }
  .prep-chatbot-send-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: var(--green, #0f766e);
    color: #ffffff;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background 0.15s ease, opacity 0.15s ease;
  }
  .prep-chatbot-send-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  .prep-chatbot-send-btn:not(:disabled):hover {
    background: #0d6962;
  }

  /* Dark Theme Support */
  body.dark-theme .prep-chatbot-window {
    background: #0f172a;
    border-color: #334155;
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
  }
  body.dark-theme .prep-chatbot-messages {
    background: #0b1120;
  }
  body.dark-theme .prep-chatbot-msg-ai {
    background: #1e293b;
    color: #f1f5f9;
    border-color: #334155;
  }
  body.dark-theme .prep-chatbot-input-area {
    background: #0f172a;
    border-color: #334155;
  }
  body.dark-theme .prep-chatbot-input {
    background: #1e293b;
    border-color: #475569;
    color: #f8fafc;
  }
  body.dark-theme .prep-chatbot-chip {
    background: #1e293b;
    border-color: #0f766e;
    color: #2dd4bf;
  }
  body.dark-theme .prep-chatbot-chip:hover {
    background: #0f766e;
    color: #ffffff;
  }
</style>

<!-- Floating Launcher Button -->
<button type="button" id="prepChatTrigger" class="prep-chatbot-trigger" aria-label="Open Mentify Prep Assistant">
  <span class="prep-online-dot"></span>
  <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
    <path d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
  </svg>
</button>

<!-- Chat Window Drawer -->
<div id="prepChatWindow" class="prep-chatbot-window" role="dialog" aria-label="Mentify Prep Assistant Chat Window">
  <div class="prep-chatbot-header">
    <div class="prep-chatbot-header-info">
      <div class="prep-chatbot-avatar">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
          <path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/>
        </svg>
      </div>
      <div>
        <h4 class="prep-chatbot-header-title">Mentify Prep Assistant</h4>
        <div class="prep-chatbot-header-subtitle">
          <span style="display:inline-block; width:6px; height:6px; background:#4ade80; border-radius:50%;"></span>
          Exam &amp; Syllabus Guide
        </div>
      </div>
    </div>
    <div class="prep-chatbot-header-actions">
      <button type="button" id="prepChatClearBtn" class="prep-chatbot-btn-icon" title="Clear chat history" aria-label="Clear chat history">
        <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
      </button>
      <button type="button" id="prepChatCloseBtn" class="prep-chatbot-btn-icon" title="Close chat window" aria-label="Close chat window">
        <svg width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>
  </div>

  <div id="prepChatMessages" class="prep-chatbot-messages">
    <!-- Welcome message -->
    <div class="prep-chatbot-msg prep-chatbot-msg-ai">
      Hi there! I am your Mentify Prep Assistant. Ask me anything about your university courses, syllabus topics, past exam papers, uploading study materials, or credits and plans!
      <div class="prep-chatbot-suggestions">
        <button type="button" class="prep-chatbot-chip" data-query="Is SMA 300 available?">Is SMA 300 available?</button>
        <button type="button" class="prep-chatbot-chip" data-query="How do credits work?">How do credits work?</button>
        <button type="button" class="prep-chatbot-chip" data-query="Which subscription plan should I choose?">Which plan should I choose?</button>
        <button type="button" class="prep-chatbot-chip" data-query="How do I upload a past paper?">How to upload past papers?</button>
      </div>
    </div>
  </div>

  <div class="prep-chatbot-input-area">
    <input type="text" id="prepChatInput" class="prep-chatbot-input" placeholder="Ask about courses, past papers, credits..." autocomplete="off">
    <button type="button" id="prepChatSendBtn" class="prep-chatbot-send-btn" aria-label="Send message">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
        <line x1="22" y1="2" x2="11" y2="13"/>
        <polygon points="22 2 15 22 11 13 2 9 22 2"/>
      </svg>
    </button>
  </div>
</div>

<script>
(function() {
  const triggerBtn = document.getElementById('prepChatTrigger');
  const chatWindow = document.getElementById('prepChatWindow');
  const closeBtn = document.getElementById('prepChatCloseBtn');
  const clearBtn = document.getElementById('prepChatClearBtn');
  const messagesContainer = document.getElementById('prepChatMessages');
  const inputEl = document.getElementById('prepChatInput');
  const sendBtn = document.getElementById('prepChatSendBtn');

  if (!triggerBtn || !chatWindow) return;

  let history = [];

  // Load history from sessionStorage
  try {
    const saved = sessionStorage.getItem('mentify_prep_chat_history');
    if (saved) {
      history = JSON.parse(saved);
      renderSavedHistory();
    }
  } catch (e) {}

  function toggleWindow() {
    chatWindow.classList.toggle('active');
    if (chatWindow.classList.contains('active')) {
      inputEl.focus();
      scrollToBottom();
    }
  }

  triggerBtn.addEventListener('click', toggleWindow);
  closeBtn.addEventListener('click', toggleWindow);

  clearBtn.addEventListener('click', function() {
    history = [];
    try { sessionStorage.removeItem('mentify_prep_chat_history'); } catch (e) {}
    messagesContainer.innerHTML = `
      <div class="prep-chatbot-msg prep-chatbot-msg-ai">
        Chat history cleared! How can I help you with your exam preparation today?
        <div class="prep-chatbot-suggestions">
          <button type="button" class="prep-chatbot-chip" data-query="Is SMA 300 available?">Is SMA 300 available?</button>
          <button type="button" class="prep-chatbot-chip" data-query="How do credits work?">How do credits work?</button>
          <button type="button" class="prep-chatbot-chip" data-query="Which subscription plan should I choose?">Which plan should I choose?</button>
        </div>
      </div>
    `;
    bindChipClicks();
  });

  function bindChipClicks() {
    messagesContainer.querySelectorAll('.prep-chatbot-chip').forEach(chip => {
      chip.onclick = function() {
        const query = this.getAttribute('data-query');
        if (query) {
          inputEl.value = query;
          sendMessage();
        }
      };
    });
  }
  bindChipClicks();

  function escapeHTML(str) {
    return String(str).replace(/[&<>"']/g, function(m) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
    });
  }

  function renderMessageContent(container, text) {
    // If the unified Prep Markdown & KaTeX engine is loaded, use it!
    if (window.renderMarkdownWithKaTeX && typeof window.renderMarkdownWithKaTeX === 'function') {
      try {
        window.renderMarkdownWithKaTeX(text, container);
        return;
      } catch (e) {
        console.warn('renderMarkdownWithKaTeX fallback:', e);
      }
    }

    // Fallback parser with link detection
    let html = escapeHTML(text);

    // Markdown Links [Text](URL)
    html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, function(match, t, url) {
      const cleanUrl = url.trim();
      if (cleanUrl.startsWith('/') || cleanUrl.startsWith('https://wa.me')) {
        return `<a href="${cleanUrl}">${t}</a>`;
      }
      return `<a href="${cleanUrl}" target="_blank" rel="noopener noreferrer">${t}</a>`;
    });

    // Auto-link relative prep paths (/prep/...)
    html = html.replace(/(^|[\s(])(\/prep\/[^\s<)]*)/g, function(match, prefix, path) {
      return `${prefix}<a href="${path}">${path}</a>`;
    });

    // Bold **text**
    html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');

    // Bullet points
    html = html.replace(/(?:^|\n)[-*\u2022]\s+([^\n]+)/g, '<br>&bull; $1');

    // Newlines to <br>
    html = html.replace(/\n/g, '<br>');

    container.innerHTML = html;
  }

  function renderSavedHistory() {
    history.forEach(item => {
      appendMessageBubble(item.role === 'user' ? 'user' : 'ai', item.text);
    });
  }

  function appendMessageBubble(role, text) {
    const msgDiv = document.createElement('div');
    msgDiv.className = `prep-chatbot-msg ${role === 'user' ? 'prep-chatbot-msg-user' : 'prep-chatbot-msg-ai'}`;

    if (role === 'user') {
      msgDiv.textContent = text;
    } else {
      renderMessageContent(msgDiv, text);
    }

    messagesContainer.appendChild(msgDiv);
    scrollToBottom();
  }

  function showTyping() {
    const typingDiv = document.createElement('div');
    typingDiv.id = 'prepChatTypingIndicator';
    typingDiv.className = 'prep-chatbot-typing';
    typingDiv.innerHTML = '<span class="prep-chatbot-dot"></span><span class="prep-chatbot-dot"></span><span class="prep-chatbot-dot"></span>';
    messagesContainer.appendChild(typingDiv);
    scrollToBottom();
  }

  function hideTyping() {
    const typingDiv = document.getElementById('prepChatTypingIndicator');
    if (typingDiv) typingDiv.remove();
  }

  function scrollToBottom() {
    messagesContainer.scrollTop = messagesContainer.scrollHeight;
  }

  function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
      const cookies = document.cookie.split(';');
      for (let i = 0; i < cookies.length; i++) {
        const cookie = cookies[i].trim();
        if (cookie.substring(0, name.length + 1) === (name + '=')) {
          cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
          break;
        }
      }
    }
    return cookieValue;
  }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text) return;

    inputEl.value = '';
    sendBtn.disabled = true;

    // Append user message
    appendMessageBubble('user', text);

    // Show typing
    showTyping();

    // Prepare payload
    const payload = {
      message: text,
      history: history
    };

    try {
      const response = await fetch('/prep/api/assistant/chat/', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-CSRFToken': getCookie('csrftoken') || ''
        },
        body: JSON.stringify(payload)
      });

      hideTyping();

      if (!response.ok) {
        appendMessageBubble('ai', 'I encountered a temporary network issue. Please try sending your message again!');
        sendBtn.disabled = false;
        return;
      }

      const data = await response.json();
      if (data.status === 'success' && data.response) {
        const replyText = data.response;

        // Update history
        history.push({ role: 'user', text: text });
        history.push({ role: 'model', text: replyText });
        if (history.length > 10) history = history.slice(-10);

        try {
          sessionStorage.setItem('mentify_prep_chat_history', JSON.stringify(history));
        } catch (e) {}

        appendMessageBubble('ai', replyText);
      } else {
        appendMessageBubble('ai', data.error || 'Sorry, I could not process your request right now.');
      }
    } catch (err) {
      hideTyping();
      appendMessageBubble('ai', 'Network connection issue. Please check your internet connection and try again.');
    } finally {
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }

  sendBtn.addEventListener('click', sendMessage);
  inputEl.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      sendMessage();
    }
  });
})();
</script>
