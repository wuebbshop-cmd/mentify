{% extends "base.html" %}

{% block title %}Verify Your Email{% endblock %}

{% block content %}
<div class="auth-page">
  <div style="width: 100%; max-width: 480px;">
    <div class="auth-card">
      <h1>Verify your email</h1>
      <p class="text-muted">
        We sent a verification link to your email address. Open that link before signing in.
      </p>
      {% if email %}
      <p class="text-muted" style="overflow-wrap: anywhere;">{{ email }}</p>
      {% endif %}
      <form method="post" action="{% url 'accounts:resend_email_verification' %}">
        {% csrf_token %}
        <label class="form-label" for="verification-email">Email address</label>
        <input id="verification-email" class="form-control" type="email" name="email" value="{{ email }}" required autocomplete="email">
        <button class="btn btn-primary btn-block" type="submit" style="margin-top: 16px;">Resend verification link</button>
      </form>
      <p style="margin: 20px 0 0; text-align: center;">
        <a href="{% url 'accounts:login' %}">Return to sign in</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
