services:
  - type: web
    name: eduai-api
    runtime: python
    pythonVersion: 3.11
    
    # ─── Build Command ───────────────────────────────────────────────
    # Installs dependencies + collects static files
    buildCommand: >
      pip install -r requirements.txt &&
      python manage.py collectstatic --clear --noinput
    
    # ─── Start Command ───────────────────────────────────────────────
    # Runs database migrations on startup + starts Gunicorn
    startCommand: python manage.py migrate --noinput && python manage.py reconcile_prep_course_costs --enqueue-published && gunicorn config.wsgi:application --bind 0.0.0.0:10000 --workers 3 --worker-class sync --timeout 120
    
    # ─── Environment Variables ───────────────────────────────────────
    # IMPORTANT: Set these in Render dashboard Environment section BEFORE deploy
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: ALLOWED_HOSTS
        value: mentify.study,www.mentify.study,mlaudit.info,www.mlaudit.info,.onrender.com,mentify-klm7.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://mentify.study,https://www.mentify.study,https://mlaudit.info,https://www.mlaudit.info,https://*.onrender.com,https://mentify-klm7.onrender.com
      - key: PYTHON_VERSION
        value: 3.11.11
      # Required for GitHub-hosted course banners, avatars, and uploads
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPO
        sync: false
      - key: GITHUB_BRANCH
        value: main
      - key: GITHUB_UPLOAD_DIR
        value: mentify-uploads
      # Required for password reset + notification emails (Resend.com)
      - key: RESEND_API_KEY
        sync: false
      - key: FROM_EMAIL
        value: mentify@mlaudit.info
      - key: SUPPORT_EMAIL
        value: mentify@mlaudit.info
      - key: CONTACT_RECIPIENT_EMAIL
        sync: false
      # Dedicated Background Worker Web Service (Option B)
      - key: WORKER_SERVICE_URL
        sync: false
      - key: INTERNAL_WORKER_SECRET
        sync: false
      # AI Provider Credentials for Main App (Topic Drills, Tutor, Practice Gen)
      - key: DEEPSEEK_API
        sync: false
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com
      - key: DEEPSEEK_CHAT_MODEL
        value: deepseek-chat
      - key: DEEPSEEK_REASONER_MODEL
        value: deepseek-reasoner
      - key: TOGETHERAI_API
        sync: false
      - key: TOGETHERAI_ID
        sync: false


  # ─── Option B: Dedicated Worker Free Web Service ─────────────────────────
  # Runs as a second free web service to execute heavy PDF/OCR extraction,
  # keeping the main web app (eduai-api) fast and lag-free.
  - type: web
    name: eduai-worker
    runtime: python
    pythonVersion: 3.11
    plan: free
    buildCommand: >
      pip install -r requirements.txt &&
      python manage.py collectstatic --clear --noinput
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:10000 --workers 2 --worker-class sync --timeout 120
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: IS_WORKER_INSTANCE
        value: "true"
      - key: INTERNAL_WORKER_SECRET
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_SSL
        sync: false
      - key: DB_TABLE_PREFIX
        sync: false
      - key: DB_TABLE_SUFFIX
        sync: false
      - key: ALLOWED_HOSTS
        value: .onrender.com,localhost,127.0.0.1
      - key: DEEPSEEK_API
        sync: false
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com
      - key: TOGETHERAI_API
        sync: false
      - key: TOGETHERAI_ID
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPO
        sync: false
      - key: GITHUB_BRANCH
        value: main
      - key: GITHUB_UPLOAD_DIR
        value: mentify-uploads

  # ─── Legacy Paid Workers (Disabled for Free Tier) ─────────────────────────
  # The paid background workers (eduai-note-worker, eduai-assessment-worker,
  # eduai-pdf-worker) have been disabled because they require a $7/mo paid dyno.
  # All background extraction is now handled by the free web service 'eduai-worker' above.

