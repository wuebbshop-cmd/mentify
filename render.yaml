services:
  - type: web
    name: eduai-api
    runtime: python
    pythonVersion: 3.11
    
    # ─── Build Command ───────────────────────────────────────────────
    # Installs dependencies + collects static files
    buildCommand: >
      pip install -r requirements.txt &&
      python manage.py collectstatic --clear --noinput
    
    # ─── Start Command ───────────────────────────────────────────────
    # Runs database migrations on startup + starts Gunicorn
    startCommand: python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:10000 --workers 3 --worker-class sync --timeout 60
    
    # ─── Environment Variables ───────────────────────────────────────
    # IMPORTANT: Set these in Render dashboard Environment section BEFORE deploy
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: ALLOWED_HOSTS
        value: mlaudit.info,www.mlaudit.info,.onrender.com,mentify-klm7.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://mlaudit.info,https://www.mlaudit.info,https://*.onrender.com,https://mentify-klm7.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: eduai-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.11
      # Required for GitHub-hosted course banners, avatars, and uploads
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPO
        sync: false
      - key: GITHUB_BRANCH
        value: main
      - key: GITHUB_UPLOAD_DIR
        value: mentify-uploads
      # Required for password reset + notification emails (Resend.com)
      - key: RESEND_API_KEY
        sync: false
      - key: FROM_EMAIL
        value: mentify@mlaudit.info
      - key: CONTACT_RECIPIENT_EMAIL
        value: techbidmarketplace@gmail.com
    
    # ─── Health Check ────────────────────────────────────────────────
    # Optional: Render pings /health/ to check if service is alive
    # You can implement a simple health check view in urls.py if desired
    healthCheckPath: /health/

databases:
  - name: eduai-db
    databaseName: mentify
    user: mentify
    plan: free
    region: oregon
    postgresMajorVersion: 16
